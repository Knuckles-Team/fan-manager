[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-manager"
version = "2.4.10"
description = "Dell PowerEdge Fan Manager + MCP Server + A2A Agent"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Public Domain",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12, <3.15"
dependencies = ["scion-sdk[mcp]>=0.6.4,<0.7.0", "python-dotenv>=1.2.4"]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = ["pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0"]

[project.scripts]
fan-manager = "fan_manager.fan_manager:fan_manager"
fan-manager-mcp = "scion_sdk.cli:serve"
fan-manager-control = "fan_manager.kg_control:main"

[project.entry-points."scion_sdk.prompt_providers"]
fan-manager = "fan_manager.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
fan-manager-mcp = "fan_manager:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fan_manager = ["mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.setuptools.packages.find]
where = ["."]
include = ["fan_manager*"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
extend-exclude = ["tests", "scripts"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.vulture]
ignore_names = ["request", "config", "ctx", "connector", "stream"]

[dependency-groups]
dev = ["pytest-timeout>=2.4.0"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "cargo", "rustc"]
env_file_optional = true
