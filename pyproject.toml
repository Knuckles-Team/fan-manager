[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-manager"
version = "2.1.0"
description = "Dell PowerEdge Fan Manager + MCP Server + A2A Agent"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: Public Domain",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12, <3.15"
dependencies = ["agent-connector-sdk>=0.2.0,<1.0.0", "python-dotenv>=1.2.4"]
[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = ["agent-connector-sdk>=0.2.0,<1.0.0"]
all = ["fan-manager[mcp,agent]>=1.7.0"]
test = ["pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0"]

[project.scripts]
fan-manager = "fan_manager.fan_manager:fan_manager"
fan-manager-mcp = "fan_manager.mcp_server:mcp_server"
fan-manager-control = "fan_manager.kg_control:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
fan-manager = "fan_manager.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
fan-manager = "fan_manager.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
fan-manager = "fan_manager.connectors"

[project.entry-points."agent_connector_sdk.prompt_providers"]
fan-manager = "fan_manager.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fan_manager = ["mcp_config.json", "skills/**", "prompts/**", "ontology/**", "connectors/**",]

[tool.setuptools.packages.find]
where = ["."]
include = ["fan_manager*"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.vulture]
ignore_names = ["request", "config", "ctx"]

[dependency-groups]
dev = ["pytest-timeout>=2.4.0"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
